    <main>
        <div class="page-header">
            <h1>お問い合わせ・参加申し込み</h1>
        </div>
        <section class="section section-narrow">
            <!--
      このサイトは静的サイト（Cloudflare Pages）なのでサーバー処理はできません。
      下記フォームは mailto: で送信する簡易版です。実運用では、
      1) action の宛先メールアドレスを実際のものに変更するか、
      2) Formspree ( https://formspree.io/ ) 等のフォーム送信サービスの action URL に差し替えるか、
      3) Cloudflare Pages Functions ( /functions/api/contact.js ) を追加してAPI化する
      ことをおすすめします。詳しくは README.md を参照してください。
    -->
            <form class="contact-form" action="mailto:info@ai-kenkyukai.example.jp" method="POST" enctype="text/plain">
                <label>お名前 *
                    <input name="name" type="text" required>
                </label>
                <label>メールアドレス *
                    <input name="email" type="email" required>
                </label>
                <label>ご所属・会社名（任意）
                    <input name="affiliation" type="text">
                </label>
                <fieldset class="radio-group">
                    <legend>参加のご希望 *</legend>
                    <label class="radio-option"><input type="radio" name="participation" value="参加を希望する" required>
                        参加を希望する</label>
                    <label class="radio-option"><input type="radio" name="participation" value="検討中（情報がほしい）">
                        検討中（情報がほしい）</label>
                    <label class="radio-option"><input type="radio" name="participation" value="問い合わせのみ">
                        問い合わせのみ</label>
                </fieldset>
                <label>メッセージ *
                    <textarea name="message" required placeholder="ご質問、参加にあたってのご要望など"></textarea>
                </label>
                <p class="form-note">※ 送信ボタンを押すとお使いのメールソフトが起動します。メールソフトが設定されていない場合は、下記の連絡先まで直接ご連絡ください。</p>
                <button class="btn btn-primary" type="submit">送信する</button>
            </form>

            <div class="contact-info-box">
                <p><strong>運営事務局</strong></p>
                <p>上田商工会議所 情報教育文化部会 事務局</p>
                <p>〒386-8522 長野県上田市大手1-10-22</p>
            </div>
        </section>
    </main>
